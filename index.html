            {"@type":"Question","name":"What is AvSGo?","acceptedAnswer":{"@type":"Answer","text":"AvSGo is a local vehicle booking platform in Assam that helps you move goods using E-rickshaw, Tata Ace, Tempo and Tractor operated by verified owners and drivers."}},
            {"@type":"Question","name":"Which vehicles can I book on AvSGo?","acceptedAnswer":{"@type":"Answer","text":"You can book E-rickshaw, Tata Ace, Tempo and Tractor for local goods transport across Assam."}},
            {"@type":"Question","name":"How can I book a vehicle?","acceptedAnswer":{"@type":"Answer","text":"Open AvSGo, tap Book a Vehicle, choose your vehicle type, pick an available vehicle, enter your name, mobile, pickup, drop and approximate distance, and confirm. No login required."}},
            {"@type":"Question","name":"Can I book an E-rickshaw for goods transport?","acceptedAnswer":{"@type":"Answer","text":"Yes. E-rickshaw booking on AvSGo is ideal for short-distance, small-load goods transport in Assam."}},
            {"@type":"Question","name":"Can I book Tata Ace, Tempo or Tractor?","acceptedAnswer":{"@type":"Answer","text":"Yes. Tata Ace booking, Tempo booking and Tractor transport are available across Assam for heavier and longer-distance loads."}},
            {"@type":"Question","name":"Is online payment available?","acceptedAnswer":{"@type":"Answer","text":"Not currently. Fares are paid directly to the driver at the trip. Owners and drivers pay their admin commission to the AvSGo UPI on file."}},
            {"@type":"Question","name":"How can an owner or driver register their vehicle?","acceptedAnswer":{"@type":"Answer","text":"Tap Driver / Vehicle Owner on the home screen, register with your mobile number and password, then add your vehicle with a photo and RC. Admin verifies and approves before it appears to customers."}},

        <!-- AvSGo native-feel splash (shown before React mounts) -->
        <style>
          #avsgo-splash {
            position: fixed; inset: 0; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            background: #16A34A;
            color: #ffffff;
            font-family: 'Outfit','Manrope','Segoe UI',Arial,sans-serif;
            transition: opacity .38s ease, visibility .38s ease;
            -webkit-tap-highlight-color: transparent;
          }
          #avsgo-splash.avsgo-splash-out { opacity: 0; visibility: hidden; pointer-events: none; }
          #avsgo-splash .avsgo-splash-inner {
            display: flex; flex-direction: column; align-items: center; gap: 22px;
            animation: avsgoRise .55s cubic-bezier(.2,.7,.3,1) both;
          }
          #avsgo-splash .avsgo-logo {
            width: 104px; height: 104px; border-radius: 26px;
            background: rgba(255,255,255,0.14);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 60px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.25);
            animation: avsgoPop .7s cubic-bezier(.2,.7,.3,1.4) both;
          }
          #avsgo-splash .avsgo-logo svg { width: 62px; height: 62px; display:block; }
          #avsgo-splash .avsgo-name {
            font-size: 40px; font-weight: 800; letter-spacing: -.02em;
            text-shadow: 0 2px 20px rgba(0,0,0,.15);
          }
          #avsgo-splash .avsgo-tag {
            font-size: 13px; opacity: .85; letter-spacing: .06em;
            text-transform: uppercase; font-weight: 600;
          }
          #avsgo-splash .avsgo-dots {
            margin-top: 6px; display: flex; gap: 6px;
          }
          #avsgo-splash .avsgo-dots span {
            width: 7px; height: 7px; border-radius: 50%; background: #ffffff;
            opacity: .35; animation: avsgoBlink 1.1s infinite ease-in-out;
          }
          #avsgo-splash .avsgo-dots span:nth-child(2) { animation-delay: .18s; }
          #avsgo-splash .avsgo-dots span:nth-child(3) { animation-delay: .36s; }
          #avsgo-splash .avsgo-footer {
            position: absolute; bottom: 24px; left: 0; right: 0;
            text-align: center; font-size: 11px; opacity: .75;
            font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
          }
          @keyframes avsgoRise { from { transform: translateY(8px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }
          @keyframes avsgoPop  { from { transform: scale(.7); opacity: 0 } to { transform: scale(1); opacity: 1 } }
          @keyframes avsgoBlink { 0%,80%,100% { opacity: .25; transform: translateY(0) } 40% { opacity: 1; transform: translateY(-3px) } }
          @media (prefers-reduced-motion: reduce) {
            #avsgo-splash .avsgo-splash-inner,
            #avsgo-splash .avsgo-logo { animation: none; }
            #avsgo-splash .avsgo-dots span { animation: none; opacity: .6; }
          }
        </style>

          </div>
          <div class="avsgo-footer">© AvSGo</div>
        </div>
        <script>
          (function () {
            window.__avsgoHideSplash = function () {
              var el = document.getElementById('avsgo-splash');
              if (!el || el.__hidden) return;
              el.__hidden = true;
              el.classList.add('avsgo-splash-out');
              setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 450);
            };
            // Safety-net: always hide after 6s even if React fails to signal
            setTimeout(window.__avsgoHideSplash, 6000);
          })();
        </script>
