name: AvSGo Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android Project
        shell: bash
        run: |
          mkdir -p android-app/app/src/main/java/in/avsgo/app
          mkdir -p android-app/app/src/main/res/values
          mkdir -p android-app/app/src/main/res/drawable

          cat > android-app/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AvSGo"
          include(":app")
          EOF

          cat > android-app/build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.7.3" apply false
          }
          EOF

          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-app/app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "in.avsgo.app"
              compileSdk 35

              defaultConfig {
                  applicationId "in.avsgo.app"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }
          }
          EOF

          cat > android-app/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AvSGo</string>
          </resources>
          EOF

          cat > android-app/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#16A34A</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat > android-app/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#16A34A"
                  android:pathData="M54,8A46,46 0,1 0,54 100A46,46 0,1 0,54 8"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,62 L43,34 L58,34 L76,62 L69,62 L64,54 L43,54 L39,62 Z"/>
          </vector>
          EOF

          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.CAMERA"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > android-app/app/src/main/java/in/avsgo/app/MainActivity.java <<'EOF'
          package in.avsgo.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private static final int LOCATION_REQ = 1001;
              private static final int FILE_REQ = 1002;

              private static final String APP_URL =
                      "https://book-ride-now-10.emergent.host";

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                              String origin,
                              GeolocationPermissions.Callback callback) {

                          if (android.os.Build.VERSION.SDK_INT >= 23 &&
                              checkSelfPermission(
                                  Manifest.permission.ACCESS_FINE_LOCATION)
                                  != PackageManager.PERMISSION_GRANTED) {

                              requestPermissions(
                                  new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                                  },
                                  LOCATION_REQ
                              );
                          }

                          callback.invoke(origin, true, false);
                      }

                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          fileCallback = callback;

                          try {
                              Intent intent = params.createIntent();
                              startActivityForResult(intent, FILE_REQ);
                              return true;
                          } catch (Exception e) {
                              fileCallback = null;
                              return false;
                          }
                      }
                  });

                  webView.loadUrl(APP_URL);
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data);

                  if (requestCode == FILE_REQ && fileCallback != null) {

                      Uri[] result = null;

                      if (resultCode == RESULT_OK && data != null) {

                          if (data.getData() != null) {
                              result = new Uri[]{data.getData()};
                          }
                      }

                      fileCallback.onReceiveValue(result);
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {

                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK and AAB
        working-directory: android-app
        run: |
          gradle --no-daemon assembleDebug bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AvSGo-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AvSGo-AAB
          path: android-app/app/build/outputs/bundle/release/app-release.aab
