name: AvSGo Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install

      - name: Build AvSGo frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://avsgo.onrender.com
        run: CI=false yarn build

      - name: Add Capacitor Android
        working-directory: frontend
        run: npx --yes @capacitor/cli@7.4.3 add android

      - name: Sync Capacitor
        working-directory: frontend
        run: npx --yes @capacitor/cli@7.4.3 sync android

      - name: Add Android Location Permissions
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      '<application',
                      permission + '\n    <application',
                      1
                  )

          manifest.write_text(text)

          print("Android location permissions added.")
          print(manifest.read_text())
          PY
    
    

      - name: Add AvSGo Floating Window Native Service
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/app/src/main")
          java_dir = root / "java/com/avsgo/app"
          java_dir.mkdir(parents=True, exist_ok=True)

          main_activity = java_dir / "MainActivity.java"
          main_activity.write_text("""package com.avsgo.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M
                      && !Settings.canDrawOverlays(this)) {
                      Intent intent = new Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:" + getPackageName())
                      );
                      startActivity(intent);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M
                      || Settings.canDrawOverlays(this)) {
                      startService(new Intent(this, FloatingWindowService.class));
                  }
              }
          }
          """)

          service = java_dir / "FloatingWindowService.java"
          service.write_text("""package com.avsgo.app;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class FloatingWindowService extends Service {
              private WindowManager manager;
              private LinearLayout panel;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();

                  if (Build.VERSION.SDK_INT >= 23
                      && !Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  manager = (WindowManager) getSystemService(WINDOW_SERVICE);
                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(12, 8, 12, 8);
                  panel.setBackgroundColor(Color.rgb(20, 110, 65));

                  TextView title = new TextView(this);
                  title.setText("AvSGo Floating Window");
                  title.setTextColor(Color.WHITE);
                  panel.addView(title);

                  Button open = new Button(this);
                  open.setText("Open AvSGo");
                  open.setOnClickListener(v -> {
                      Intent launch = getPackageManager()
                          .getLaunchIntentForPackage(getPackageName());
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(launch);
                      }
                  });
                  panel.addView(open);

                  Button close = new Button(this);
                  close.setText("Close window");
                  close.setOnClickListener(v -> stopSelf());
                  panel.addView(close);

                  int type = Build.VERSION.SDK_INT >= 26
                      ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      : WindowManager.LayoutParams.TYPE_PHONE;

                  WindowManager.LayoutParams params =
                      new WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      );

                  params.gravity = Gravity.TOP | Gravity.END;
                  params.x = 16;
                  params.y = 140;
                  manager.addView(panel, params);
              }

              @Override
              public void onDestroy() {
                  if (manager != null && panel != null) {
                      try {
                          manager.removeView(panel);
                      } catch (Exception ignored) {}
                  }
                  super.onDestroy();
              }
          }
          """)

          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text()
          service_tag = (
              '<service android:name=".FloatingWindowService" '
              'android:exported="false" />'
          )

          if 'android:name=".FloatingWindowService"' not in text:
              text = text.replace(
                  "</application>",
                  "        " + service_tag + "\n    </application>",
                  1
              )

          manifest.write_text(text)
          print("AvSGo Floating Window files created.")
          PY

          

      - name: Install Java 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Build AAB
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AvSGo-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AvSGo-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
