name: AvSGo Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        working-directory: frontend
        run: yarn install

      - name: Build AvSGo frontend
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://avsgo.onrender.com
        run: CI=false yarn build

      - name: Add Capacitor Android
        working-directory: frontend
        run: npx --yes @capacitor/cli@7.4.3 add android

      - name: Sync Capacitor
        working-directory: frontend
        run: npx --yes @capacitor/cli@7.4.3 sync android

      - name: Add Android Location Permissions
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      '<application',
                      permission + '\n    <application',
                      1
                  )

          manifest.write_text(text)

          print("Android location permissions added.")
          print(manifest.read_text())
          PY
    
    

      - name: Add AvSGo Floating Window Native Service
        working-directory: frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/app/src/main")
          java_dir = root / "java/com/avsgo/app"
          java_dir.mkdir(parents=True, exist_ok=True)

          plugin = java_dir / "AvSGoFloatingWindowPlugin.java"
          plugin.write_text(r"""package com.avsgo.app;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import com.getcapacitor.ActivityCallback;
          import com.getcapacitor.ActivityResult;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "AvSGoFloatingWindow")
          public class AvSGoFloatingWindowPlugin extends Plugin {
              @PluginMethod
              public void start(PluginCall call) {
                  String token = call.getString("token", "");
                  if (token.isEmpty()) {
                      call.reject("Driver login token missing");
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= 23
                  && !Settings.canDrawOverlays(getContext())) {
                      Intent settings = new Intent(
                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:" + getContext().getPackageName())
                      );
                      startActivityForResult(
                          call, settings, "overlayPermissionResult"
                      );
                      return;
                  }

                  startFloatingService(token);
                  call.resolve();
                  }

                  @ActivityCallback
                  private void overlayPermissionResult(
                      PluginCall call,
                      ActivityResult result
                  ) {
                      if (call == null) return;

                      if (Build.VERSION.SDK_INT >= 23
                          && !Settings.canDrawOverlays(getContext())) {
                          call.reject("Floating Window permission not granted");
                          return;
                      }

                      String token = call.getString("token", "");
                      if (token.isEmpty()) {
                      call.reject("Driver login token missing");
                          return;
                      }

                      startFloatingService(token);
                      call.resolve();
                  }

                  private void startFloatingService(String token) {
                      Intent intent = new Intent(
                          getContext(), FloatingWindowService.class
                      );
                      intent.setAction("START");
                      intent.putExtra("token", token);

                      if (Build.VERSION.SDK_INT >= 26) {
              getContext().startForegroundService(intent);
                  } else {
                      getContext().startService(intent);
                  }
              }
              

              @PluginMethod
              public void stop(PluginCall call) {
                  getContext().stopService(new Intent(
                      getContext(), FloatingWindowService.class
                  ));
                  call.resolve();
              }
          }
          """)

          main_activity = java_dir / "MainActivity.java"
          main_activity.write_text(r"""package com.avsgo.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(AvSGoFloatingWindowPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          """)

          service = java_dir / "FloatingWindowService.java"
          service.write_text(r"""package com.avsgo.app;

          import android.app.*;
          import android.content.*;
          import android.graphics.*;
          import android.os.*;
          import android.provider.Settings;
          import android.view.*;
          import android.widget.*;
          import org.json.*;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.TimeZone;
          import java.util.concurrent.*;

          public class FloatingWindowService extends Service {
              private static final String BASE = "https://avsgo.onrender.com/api";
              private final Handler handler = new Handler(Looper.getMainLooper());
              private ExecutorService worker;
              private WindowManager manager;
              private LinearLayout panel;
              
              private WindowManager.LayoutParams windowParams;
              private float touchX, touchY;
              private int startX, startY;
              private String token = "";
              private boolean minimized = false;
              private boolean busy = false;

              @Override
              public IBinder onBind(Intent i) { return null; }

              @Override
              public int onStartCommand(Intent intent, int flags, int id) {
                  if (intent != null && intent.getStringExtra("token") != null) {
                      token = intent.getStringExtra("token");
                  }
                  if (token.isEmpty()) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  createChannel();
                  Notification notification = new Notification.Builder(this, "avsgo_float")
                      .setContentTitle("AvSGo Driver")
                      .setContentText("Booking requests are being checked")
                      .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                      .setOngoing(true)
                      .build();
                  startForeground(701, notification);

                  if (Build.VERSION.SDK_INT >= 23 && !Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  if (manager == null) createWindow();
                  if (worker == null || worker.isShutdown()) {
                      worker = Executors.newSingleThreadExecutor();
                      worker.execute(() -> {
                          while (!Thread.currentThread().isInterrupted()) {
                              try {
                                  String result = request("GET", "/driver/bookings", null);
                                  JSONArray all = new JSONArray(result);
                                  JSONArray pending = new JSONArray();
                                  for (int i = 0; i < all.length(); i++) {
                                      JSONObject b = all.optJSONObject(i);
                                      if (b != null && "requested".equals(b.optString("status"))) {
                                          pending.put(b);
                                      }
                                  }
                                  handler.post(() -> renderBookings(pending));
                                  Thread.sleep(5000);
                              } catch (InterruptedException e) {
                                  Thread.currentThread().interrupt();
                                  break;
                              
                              } catch (Exception e) {
                                  String errorMessage = e.getMessage();
                                  if (errorMessage == null || errorMessage.trim().isEmpty()) {
                              errorMessage = e.getClass().getSimpleName();
                              }

                              final String visibleError = errorMessage;
                                  android.util.Log.e(
                                      "AvSGoFloat",
                                      "Booking refresh failed",
                                      e
                                  );

                                  handler.post(() -> showMessage(
                                      "Booking refresh failed: " + visibleError
                                  ));

                                  try {
                                      Thread.sleep(7000);
                                  } catch (InterruptedException x) {
                              Thread.currentThread().interrupt();
                                      break;
                                  }
                              }
                          }

                      
                  });
                      
                  }
                  return START_STICKY;
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(
                          "avsgo_float", "AvSGo Driver Window",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      ((NotificationManager)getSystemService(NOTIFICATION_SERVICE))
                          .createNotificationChannel(channel);
                  }
              }

              private void createWindow() {
                  manager = (WindowManager)getSystemService(WINDOW_SERVICE);
                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(12, 8, 12, 8);
                  panel.setBackgroundColor(Color.rgb(20, 110, 65));

                  int type = Build.VERSION.SDK_INT >= 26
                      ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      : WindowManager.LayoutParams.TYPE_PHONE;

                      windowParams = new WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                  type,
                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                  PixelFormat.TRANSLUCENT
               );
                windowParams.gravity = Gravity.TOP | Gravity.END;
                windowParams.x = 12;
                windowParams.y = 100;
                manager.addView(panel, windowParams);

                  showMessage("Checking new bookings…");
              }
              
              
              private void enableDrag(View handle) {
                  handle.setOnTouchListener((view, event) -> {
                      switch (event.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              touchX = event.getRawX();
                              touchY = event.getRawY();
                              startX = windowParams.x;
                              startY = windowParams.y;
                              return true;

                          case MotionEvent.ACTION_MOVE:
                              int dx = Math.round(
                                  touchX - event.getRawX()
                              );
                              int dy = Math.round(
                                  event.getRawY() - touchY
                              );

                              windowParams.x = Math.max(
                                  0, startX + dx
                              );
                              windowParams.y = Math.max(
                                  0, startY + dy
                              );

                              try {
                                  manager.updateViewLayout(
                                      panel, windowParams
                                  );
                              } catch (Exception e) {
                                  android.util.Log.e(
                                      "AvSGoFloat",
                                      "Drag failed",
                                      e
                                  );
                              }
                              return true;

                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              return true;
                      }
                      return true;
                  });
              }


              private void addButton(LinearLayout box, String label, Runnable action) {
                  Button button = new Button(this);
                  button.setText(label);
                  button.setOnClickListener(v -> action.run());
                  box.addView(button);
              }

              private void showMessage(String message) {
                  if (panel == null) return;
                  panel.removeAllViews();
                  TextView title = new TextView(this);
                  title.setText("AvSGo Driver.Drag here");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(17);

                  title.setLayoutParams(new LinearLayout.LayoutParams(
                  WindowManager.LayoutParams.MATCH_PARENT,
                  WindowManager.LayoutParams.WRAP_CONTENT));
                  title.setPadding(8, 12, 8, 12);
                  title.setBackgroundColor(Color.rgb(12, 80, 45));
                  panel.addView(title);
                  enableDrag(title);
                  TextView info = new TextView(this);
                  info.setText(message);
                  info.setTextColor(Color.WHITE);
                  panel.addView(info);
                  addControls();
              }

              private void addControls() {
                  addButton(panel, "Full Screen", () -> {
                      Intent launch = getPackageManager()
                          .getLaunchIntentForPackage(getPackageName());
                      if (launch != null) {
                          launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK
                              | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                          startActivity(launch);
                      }
                  });
                  addButton(panel, minimized ? "Expand" : "Minimize", () -> {
                      minimized = !minimized;
                      if (minimized) {
                          showMessage("Window minimized — tap Expand");
                      } else {
                          refreshNow();
                      }
                  });
                  addButton(panel, "Close Window", this::stopSelf);
              }
              
          private long expiryMillis(JSONObject booking) {
              String value = booking.optString("request_expires_at", "");

              if (value.isEmpty() || "null".equals(value)) {
                  return -1L;
              }

              try {
                  String timestamp = value.length() >= 19
                      ? value.substring(0, 19)
                      : value;

                  SimpleDateFormat format = new SimpleDateFormat(
                      "yyyy-MM-dd'T'HH:mm:ss",
                      Locale.US
                  );
                  format.setTimeZone(TimeZone.getTimeZone("UTC"));

                  Date date = format.parse(timestamp);
                  return date == null ? -1L : date.getTime();
              } catch (Exception e) {
                  return -1L;
              }
          }
              

          private void renderBookings(JSONArray bookings) {
              if (panel == null || minimized) return;

              panel.removeAllViews();

              TextView title = new TextView(this);
              title.setText("AvSGo • New Bookings: " + bookings.length()
                  + "\nDrag here to move");
              title.setTextColor(Color.WHITE);
              title.setTextSize(17);
              title.setPadding(8, 12, 8, 12);
              title.setBackgroundColor(Color.rgb(12, 80, 45));
              panel.addView(title);
              enableDrag(title);

              if (bookings.length() == 0) {
                  TextView empty = new TextView(this);
                  empty.setText("Waiting for booking requests…");
                  empty.setTextColor(Color.WHITE);
                  empty.setPadding(4, 12, 4, 12);
                  panel.addView(empty);
              }

              for (int i = 0; i < bookings.length(); i++) {
                  JSONObject b = bookings.optJSONObject(i);
                  if (b == null) continue;

                  final String id = b.optString("id", "");
                  final long expiresAt = expiryMillis(b);

                  TextView detail = new TextView(this);
                  detail.setText(
                      "Pickup: " + b.optString("pickup", "—")
                      + "\nDrop: " + b.optString("drop_location", "—")
                      + "\nVehicle: " + b.optString("vehicle_type", "—")
                      + "\nFare: ₹" + b.optString("fare", "—")
                  );
                  detail.setTextColor(Color.WHITE);
                  detail.setPadding(4, 10, 4, 8);
                  panel.addView(detail);

                  TextView timer = new TextView(this);
                  timer.setTextColor(Color.YELLOW);
                  timer.setTextSize(15);
                  panel.addView(timer);

                  LinearLayout actions = new LinearLayout(this);
                  actions.setOrientation(LinearLayout.HORIZONTAL);

                  Button accept = new Button(this);
                  accept.setText("Accept");
                  actions.addView(accept);

                  Button reject = new Button(this);
                  reject.setText("Reject");
                  actions.addView(reject);

                  panel.addView(actions);

                  Runnable updateTimer = new Runnable() {
                      @Override
                      public void run() {
                          if (panel == null || timer.getParent() == null) {
                              return;
                          }

                          if (expiresAt <= 0) {
                              timer.setText("Expiry time unavailable");
                              accept.setEnabled(false);
                              reject.setEnabled(false);
                              return;
                          }

                          long remaining = Math.max(
                              0L,
                              (expiresAt - System.currentTimeMillis() + 999L)
                                  / 1000L
                          );

                          if (remaining <= 0) {
                              timer.setText("Request expired");
                              accept.setEnabled(false);
                              reject.setEnabled(false);
                              return;
                          }

                          timer.setText(
                              "Accept within " + remaining + " seconds"
                          );
                          handler.postDelayed(this, 1000);
                      }
                  };

                  updateTimer.run();

                  accept.setOnClickListener(v -> {
                      if (busy) return;

                      if (expiresAt <= 0 ||
                          System.currentTimeMillis() >= expiresAt) {
                          timer.setText("Request expired");
                          accept.setEnabled(false);
                          reject.setEnabled(false);
                          return;
                      }

                      accept.setEnabled(false);
                      reject.setEnabled(false);
                      act(id, "accept");
                  });

                  reject.setOnClickListener(v -> {
                      if (busy) return;

                      if (expiresAt <= 0 ||
                          System.currentTimeMillis() >= expiresAt) {
                          timer.setText("Request expired");
                          accept.setEnabled(false);
                          reject.setEnabled(false);
                          return;
                      }

                      accept.setEnabled(false);
                      reject.setEnabled(false);
                      act(id, "reject");
                  });
              }

              addControls();
          }

              private void refreshNow() {
                  if (worker != null && !worker.isShutdown()) {
                      worker.execute(() -> {
                          try {
                              JSONArray all = new JSONArray(
                                  request("GET", "/driver/bookings", null));
                              JSONArray pending = new JSONArray();
                              for (int i = 0; i < all.length(); i++) {
                                  JSONObject b = all.optJSONObject(i);
                                  if (b != null && "requested".equals(b.optString("status"))) {
                                      pending.put(b);
                                  }
                              }
                              handler.post(() -> renderBookings(pending));
                              
                          } catch (Exception e) {
                              handler.post(() -> showMessage("Refresh failed. Check internet."));
                          }
                      });
                  }
              }

              private void act(String id, String action) {
                  if (busy || id == null || id.isEmpty()) return;
                  busy = true;
                  if (worker == null || worker.isShutdown()) {
                      busy = false;
                      return;
                  }
                  worker.execute(() -> {
                      try {
                          JSONObject body = new JSONObject();
                          body.put("action", action);
                          request("PATCH", "/driver/bookings/" + id, body);
                          handler.post(() -> showMessage("Booking " + action + " submitted"));
                      } catch (Exception e) {
                          handler.post(() -> showMessage(
                              "Action failed. Refresh Driver Panel and try again."));
                      } finally {
                          busy = false;
                          handler.postDelayed(this::refreshNow, 1200);
                      }
                  });
              }

              private String request(String method, String path, JSONObject body)
                  throws Exception {
                  HttpURLConnection conn = (HttpURLConnection)
                      new URL(BASE + path).openConnection();
                  conn.setRequestMethod(method);
                  conn.setConnectTimeout(10000);
                  conn.setReadTimeout(10000);
                  conn.setRequestProperty("Authorization", "Bearer " + token);
                  conn.setRequestProperty("x-role", "driver");
                  conn.setRequestProperty("Content-Type", "application/json");
                  if (body != null) {
                      conn.setDoOutput(true);
                      try (OutputStream out = conn.getOutputStream()) {
                          out.write(body.toString().getBytes(StandardCharsets.UTF_8));
                      }
                  }
                  int code = conn.getResponseCode();
                  InputStream stream = code >= 200 && code < 400
                      ? conn.getInputStream() : conn.getErrorStream();
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  if (stream != null) {
                      byte[] buffer = new byte[2048];
                      int n;
                      while ((n = stream.read(buffer)) != -1) out.write(buffer, 0, n);
                      stream.close();
                  }
                  String response = out.toString("UTF-8");
                  conn.disconnect();
                  if (code < 200 || code >= 300) {
                      throw new IOException("HTTP " + code + ": " + response);
                  }
                  return response;
              }

              @Override
              public void onDestroy() {
                  if (worker != null) worker.shutdownNow();
                  handler.removeCallbacksAndMessages(null);
                  if (manager != null && panel != null) {
                      try { manager.removeView(panel); } catch (Exception ignored) {}
                  }
                  stopForeground(true);
                  super.onDestroy();
              }
          }
          """)

          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace("<application", permission + "\n    <application", 1)

          service_tag = (
              '<service android:name=".FloatingWindowService" '
              'android:exported="false" android:foregroundServiceType="dataSync" />'
          )
          if 'android:name=".FloatingWindowService"' not in text:
              text = text.replace("</application>", "        " + service_tag + "\n    </application>", 1)

          manifest.write_text(text)
          print("AvSGo Floating Window plugin and service created.")
          PY

          

      - name: Install Java 21
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> $GITHUB_PATH

      - name: Build APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Build AAB
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AvSGo-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AvSGo-AAB
          path: frontend/android/app/build/outputs/bundle/release/*.aab
